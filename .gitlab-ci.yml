backend-test:
  stage: test
  image: python
  services:
    - name: mariadb:latest

  variables:
    # Configure mysql environment variables (https://hub.docker.com/_/mysql/)
    MARIADB_DATABASE: $DB_NAME
    MARIADB_ROOT_PASSWORD: $DB_PASSWORD

  before_script:
    - apt-get update
    - apt-get install -y mariadb-client
    - apt-get install -y mariadb-server
    - mariadb --version
    - mariadb --user=root --password="$MARIADB_ROOT_PASSWORD" --host=mariadb
    - mariadb --execute "CREATE DATABASE "$DB_NAME";""
    - mariadb --execute "USE "$DB_NAME";""
    - mariadb "$DB_NAME" init-schema.sql;
    - mariadb "$DB_NAME" init-metadata.sql;

  script:
    - cd backend/CHIL
    - pip install Poetry
    - poetry -V
    - poetry install
    - poetry run python manage.py test chil/tests --settings=config.django.test

pages:
  stage: deploy
  image: node:lts

  script:
    - mkdir public
    - npm install @redocly/cli
    - npx redocly build-docs -o public/index.html docs/api/openapi.yaml

  artifacts:
    paths:
      - public

  only:
    - master
